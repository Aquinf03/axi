name: Bug report
description: Something is broken or behaves unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Fill in what you can so we can reproduce it.
        Security issues: email **aquin@aquin.app** — do not file them here.
        Train / eval / fleet issues: open them on [aq](https://github.com/aquinf03/aq), not here.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, chat slash sequence, or minimal workspace steps.
      placeholder: |
        1. cd /path/to/project
        2. axi
        3. /mission set …
        4. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include exit codes, logs, or stack traces when possible. Redact secrets.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node, axi version, provider. Paste `axi doctor` output if you can (redact keys).
      placeholder: |
        OS:
        node -v:
        axi version:   # or: node dist/cli.js --version / package.json
        provider:
        AXI_PERMISSION_MODE (if set):
        aq available? (yes/no — only if train tools matter):
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Links, related PRs, screenshots (optional).
