name: Feature request
description: Propose a focused improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Open an issue before a large PR. Describe the problem first, then the approach.
        Framework (train/eval) features belong in [aq](https://github.com/aquinf03/aq).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today? Who hits this?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: How you think axi should change (chat, ask, tools, mission, arl, permissions, …).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other options you thought about (optional).
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not bypass `authorizeTool` / weaken permission defaults without discussion
          required: false
        - label: This does not import aq in-process (shell-out only when needed)
          required: false
        - label: I am willing to help implement or add a unit/eval case if this is accepted
          required: false
