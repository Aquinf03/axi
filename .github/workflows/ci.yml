name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, gates, unit, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: axi-backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # .axi_root + axi-backend/bin/axi are gitignored; create them like local `npm run setup`.
      - name: Materialize generated workspace files
        working-directory: .
        run: |
          bash ./gen.sh
          bash ./post_setup.sh

      # Resolve deps on the runner — do not require a committed lockfile.
      - name: Install
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build

      - name: Module boundaries
        run: npm run check:boundaries

      - name: Public surface (no personal paths / secrets)
        run: npm run check:public-surface

      - name: Size + startup budgets
        run: npm run check:budgets

      - name: E2E corpus classification
        run: npm run check:corpus

      - name: Unit tests
        run: npm run test:unit

      - name: Smoke built binary (happy path)
        run: npm run smoke
